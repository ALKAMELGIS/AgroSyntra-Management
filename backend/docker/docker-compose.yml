services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: almaha
      POSTGRES_PASSWORD: almaha_dev
      POSTGRES_DB: almahafarm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
